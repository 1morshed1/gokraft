# docker-compose brings up the full gokraft stack: the four infrastructure
# dependencies (Kafka, ClickHouse, TimescaleDB, Postgres) plus the six gokraft
# services. It is the fastest way to see the whole pipeline working end to end.
#
#   docker compose up -d --build        # start everything
#   docker compose --profile load up loadgen   # then push synthetic traffic
#   open http://localhost:8080          # the dashboard
#
# The infra images are pinned to specific versions so the stack is reproducible.
# Migrations are auto-applied on first boot via mounted init scripts (ClickHouse
# and Postgres both run *.sql in their docker-entrypoint-initdb.d).

services:
  # --- Kafka in KRaft mode (no ZooKeeper), official Apache image ---
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"    # internal listener (advertised as kafka:9092)
      - "29092:29092"  # host listener (advertised as localhost:29092)
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Three listeners. A Kafka client first connects to a bootstrap address,
      # then the broker replies with the ADVERTISED address to use for the real
      # connection. Containers must be told "kafka:9092" (resolvable on the
      # compose network) while processes on the host must be told
      # "localhost:29092" — one advertised name cannot satisfy both, hence two
      # client listeners. CONTROLLER is the internal KRaft quorum listener.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Single-node: internal topics can't replicate beyond 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Auto-create the three topics on first produce/consume so we don't need a
      # separate bootstrap step. In production you'd create them explicitly with
      # a chosen partition count.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # --- ClickHouse (logs) ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    # NOTE: ClickHouse recommends raising the open-files ulimit in production
    # (nofile 262144). We omit it here because some sandboxed Docker runtimes
    # forbid setting rlimits; add it back on a normal host.
    volumes:
      - ./migrations/clickhouse.sql:/docker-entrypoint-initdb.d/clickhouse.sql:ro
      - ./deploy/clickhouse/users.xml:/etc/clickhouse-server/users.d/gokraft.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- TimescaleDB (metrics) ---
  timescale:
    image: timescale/timescaledb:2.16.1-pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: gokraft
      POSTGRES_PASSWORD: gokraft
      POSTGRES_DB: metrics
    volumes:
      - ./migrations/timescale.sql:/docker-entrypoint-initdb.d/timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gokraft -d metrics"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- PostgreSQL (traces) ---
  postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: gokraft
      POSTGRES_PASSWORD: gokraft
      POSTGRES_DB: traces
    volumes:
      - ./migrations/postgres.sql:/docker-entrypoint-initdb.d/postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gokraft -d traces"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- gokraft services ---
  collector:
    build: { context: ., args: { CMD_NAME: collector } }
    ports:
      - "4317:4317"   # OTLP/gRPC
    environment:
      COLLECTOR_ADDR: ":4317"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      kafka: { condition: service_healthy }

  logwriter:
    build: { context: ., args: { CMD_NAME: logwriter } }
    environment:
      KAFKA_BROKERS: "kafka:9092"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_USER: "gokraft"
      CLICKHOUSE_PASS: "gokraft"
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  metricwriter:
    build: { context: ., args: { CMD_NAME: metricwriter } }
    environment:
      KAFKA_BROKERS: "kafka:9092"
      TIMESCALE_DSN: "postgres://gokraft:gokraft@timescale:5432/metrics"
    depends_on:
      kafka: { condition: service_healthy }
      timescale: { condition: service_healthy }

  tracewriter:
    build: { context: ., args: { CMD_NAME: tracewriter } }
    environment:
      KAFKA_BROKERS: "kafka:9092"
      POSTGRES_DSN: "postgres://gokraft:gokraft@postgres:5432/traces"
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  queryapi:
    build: { context: ., args: { CMD_NAME: queryapi } }
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_USER: "gokraft"
      CLICKHOUSE_PASS: "gokraft"
      TIMESCALE_DSN: "postgres://gokraft:gokraft@timescale:5432/metrics"
      POSTGRES_DSN: "postgres://gokraft:gokraft@postgres:5432/traces"
    depends_on:
      clickhouse: { condition: service_healthy }
      timescale: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # loadgen is under a profile so it only runs when explicitly requested:
  #   docker compose --profile load up loadgen
  loadgen:
    build: { context: ., args: { CMD_NAME: loadgen } }
    profiles: ["load"]
    environment:
      COLLECTOR_ADDR: "collector:4317"
      SERVICES: "10"
      RATE: "20"
    depends_on:
      - collector
