          env: [{ name: KAFKA_GROUP, value: "metricwriter" }]
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracewriter
  namespace: gokraft
spec:
  replicas: 1
  selector: { matchLabels: { app: tracewriter } }
  template:
    metadata: { labels: { app: tracewriter } }
    spec:
      containers:
        - name: tracewriter
          image: gokraft/tracewriter:latest
